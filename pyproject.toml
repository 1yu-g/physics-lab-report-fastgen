[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-lab-report-fastgen"
version = "0.3.0"
description = "Local CLI and Codex skill for verified Chinese physics lab reports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "python-docx>=1.1.0",
  "Pillow>=10.0.0",
  "pypdf>=5.0.0",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.2", "scipy>=1.14", "sympy>=1.13", "pint>=0.24",
  "uncertainties>=3.2", "matplotlib>=3.9",
]
ocr = ["img2table[rapidocr]>=2.0.0,<3.0"]
figures = ["schemdraw>=0.20"]
complex = ["docling>=2.70"]
all = [
  "pandas>=2.2", "scipy>=1.14", "sympy>=1.13", "pint>=0.24",
  "uncertainties>=3.2", "matplotlib>=3.9",
  "img2table[rapidocr]>=2.0.0,<3.0", "schemdraw>=0.20",
]

[project.scripts]
labfast = "labfast:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = [
  "labfast", "workflow", "material_ingest", "table_ocr", "analyze_data",
  "figure_tools", "fastgen", "docx_patch", "template_profile", "draft_report",
  "review_dashboard",
  "benchmark",
]
